name: examples
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  postgres-custom-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t example-pg postgres-custom-image
      - name: Starts and the extension loads
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci example-pg
          for _ in $(seq 60); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          docker exec pg psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE EXTENSION hypopg;"
